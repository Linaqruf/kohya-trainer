# Anima 2B LoRA preset. Keys are sd-scripts argument names.
# bf16, because upstream does not support fp8. A T4 has no native bf16, so it is
# much slower there.

[network]
network_module = "networks.lora_anima"
# The Anima author's recipe: rank 32, alpha equal to rank, at 2e-5.
network_dim = 32
network_alpha = 32
# Only the DiT trains, so text encoder outputs can be cached. To train the LLM
# adapter too, set network_args = ["train_llm_adapter=True"].
network_train_unet_only = true

[optimizer]
optimizer_type = "AdamW8bit"
# The author's betas, for AdamW8bit only. Another optimizer runs without them.
optimizer_args = ["betas=0.9,0.99"]
# Set for the rank and alpha above. Lower it if you raise alpha.
learning_rate = 2e-5
# 100 warmup steps, then a flat rate, as the author trains.
lr_scheduler = "constant_with_warmup"
lr_warmup_steps = 100
max_grad_norm = 1.0

[flow_matching]
# Sigmoid sampling, as Anima was trained, ignores the shift. The author uses scale 1.3.
timestep_sampling = "sigmoid"
discrete_flow_shift = 1.0
sigmoid_scale = 1.3

[precision_memory]
mixed_precision = "bf16"
save_precision = "bf16"
gradient_checkpointing = true
gradient_accumulation_steps = 1
cache_latents = true
cache_latents_to_disk = true
cache_text_encoder_outputs = true
cache_text_encoder_outputs_to_disk = true
# The image-only 2D VAE caches latents about twice as fast, with less GPU memory.
qwen_image_vae_2d = true
max_data_loader_n_workers = 2
persistent_data_loader_workers = true

[run]
max_train_epochs = 10
seed = 42

[saving]
save_model_as = "safetensors"
save_every_n_epochs = 1
# Saves the training state each epoch, so a stopped session can resume. Only the newest is kept.
save_state = true
save_last_n_epochs_state = 1

[sampling]
# Upstream fixes the sampler (rectified-flow Euler). Steps and CFG go in the prompt file.
sample_every_n_epochs = 1
